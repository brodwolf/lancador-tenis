0" height="300" rx="4" class="bx"/><text x="908" y="87" class="bt" text-anchor="start" >2× TMC2209 · UART de 1 fio</text><text x="908" y="103" class="sm" text-anchor="start" >PDN_UART dos dois ligados juntos</text><text x="908" y="117" class="sm" text-anchor="start" >TX do ESP32 entra por 1 kΩ; RX direto</text><text x="908" y="131" class="sm" text-anchor="start" >EN comum, ativo em 0: com o pull-up,</text><text x="908" y="145" class="sm" text-anchor="start" >  os motores ficam soltos no boot</text><text x="908" y="159" class="sm" text-anchor="start" >endereço do giro: MS1=0 MS2=0</text><text x="908" y="173" class="sm" text-anchor="start" >endereço do tilt: MS1=1 MS2=0</text><text x="908" y="187" class="sm" text-anchor="start" >VIO = 3V3 · VM = 19–24 V (F1)</text><text x="908" y="201" class="sm" text-anchor="start" >100 µF/35 V em cada driver</text><text x="908" y="215" class="sm" text-anchor="start" >0,8 A RMS e 1/8 de passo por UART</text><text x="908" y="229" class="sm" text-anchor="start" >STEP/DIR: fio curto, &lt; 30 cm</text><text x="908" y="243" class="sm" text-anchor="start" >DIAG do tilt: referência por</text><text x="908" y="257" class="sm" text-anchor="start" >  StallGuard (opcional)</text><rect x="900" y="384" width="260" height="76" rx="4" class="bx"/><text x="908" y="401" class="bt" text-anchor="start" >Saídas dos motores → X3</text><text x="908" y="417" class="sm" text-anchor="start" >giro A1 A2 B1 B2 → pinos 1–4</text><text x="908" y="431" class="sm" text-anchor="start" >tilt A1 A2 B1 B2 → pinos 5–8</text><rect x="900" y="474" width="260" height="86" rx="4" class="bx soft"/><text x="908" y="491" class="bt" text-anchor="start" >Livres para a máquina completa</text><text x="908" y="507" class="sm" text-anchor="start" >1, 2 baterias · 3 rádio · 8 agitador</text><text x="908" y="521" class="sm" text-anchor="start" >9, 48 I²C · 21 bola · 38 semáforo</text><text x="908" y="535" class="sm" text-anchor="start" >39, 40 tela · 46 buzzer</text></svg>